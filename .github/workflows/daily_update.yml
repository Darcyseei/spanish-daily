name: Daily Spanish Feed Auto Update

on:
  schedule:
    # 提前至北京时间清晨 05:37 (UTC 21:37 / 东京时间 06:37) 错峰自动触发，避开整点拥堵排队
    - cron: '37 21 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上随时点击按钮立即手动更新

permissions:
  contents: write

jobs:
  update-daily-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install edge-tts

      - name: Generate Today's Spanish Stories & Audios
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/daily_updater.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ index.html data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Daily Spanish 10 Stories & Audios $(date +'%Y-%m-%d')" && git push origin main)
